[package]
name = "kino"
version = "0.8.0"
edition = "2021"
authors = ["Yaroslav Markin <yaroslav@markin.net>"]
license = "MIT"
publish = false

[lib]
# rlib in addition to cdylib so `cargo test` can link unit tests.
crate-type = ["cdylib", "rlib"]


[dependencies]
magnus = { version = "0.9.0", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }
flume = "0.12"
parking_lot = "0.13"
ahash = "0.8"
smallvec = "1"
lru = "0.19"
mimalloc = { version = "0.1", default-features = false }
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
hyper = { version = "1.6", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
# Parses a hijacked app's response head; already in the tree via hyper.
httparse = "1.10"
bytes = "1"
# Local-time stamps for the access log: the system zone only (no bundled
# tzdb, no serde), which keeps the dependency tree to jiff itself.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# ring (not the default aws-lc-rs) as the rustls crypto provider: it
# cross-compiles cleanly in rb-sys-dock containers, while aws-lc-sys wants
# cmake and a per-target C toolchain.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# Either, one stream type for TCP, unix and TLS connections; already in
# the tree via h2.
tokio-util = { version = "0.7", default-features = false }
rustls-pemfile = "2.2"
# SHA-1 for the WebSocket handshake key; already in the tree via rustls.
ring = "0.17"
# Reads WebSocket client frames into messages; Kino writes its own frames.
tungstenite = { version = "0.30", default-features = false }
# EPROTO, which std has no ErrorKind for; already in the tree via tokio.
libc = "0.2"
# Socket calls std lacks: hijack bridge reads without tokio, a unix bind's
# nonblocking live-socket check, the intake's recv, and StdConn, the
# inline connections' socket; already in the tree via tokio.
socket2 = "0.6"

# musl's loader rejects initial-exec TLS in dlopen'd libraries ("initial-exec
# TLS resolves to dynamic definition"); build the same mimalloc with the
# local-dynamic TLS model there. glibc keeps the faster initial-exec model.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[build-dependencies]
rb-sys-env = "0.2.2"

[dev-dependencies]
# Test binaries must resolve libruby symbols that the cdylib leaves
# undefined (the host process provides them at runtime); feature
# unification turns this on only for `cargo test`.
rb-sys = { version = "0.9", features = ["link-ruby"] }
# The protocol tests drive the server end of a duplex pipe with hyper's
# own client, and pause the clock to test timeouts; feature unification
# enables both only for `cargo test`.
hyper = { version = "1.6", features = ["client"] }
tokio = { version = "1.45", features = ["test-util"] }
proptest = { version = "1", default-features = false, features = ["std"] }
